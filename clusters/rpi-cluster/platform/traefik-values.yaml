# Traefik values for a bare-metal Raspberry Pi cluster.

deployment:
  # DaemonSet, not Deployment: with hostPort below, one Traefik per node means
  # any Pi's IP serves the site, so your router/DNS can point at any of them.
  kind: DaemonSet

# No LoadBalancer implementation on bare metal (that would be MetalLB, not yet
# scaffolded), so bind the host's ports directly. ClusterIP + hostPort is the
# simplest thing that works on a homelab.
#
# Alternative once MetalLB exists: service.type LoadBalancer and drop hostPort.
service:
  # NOTE the nesting: in this chart the Service type lives at
  # `service.spec.type`, NOT `service.type`. A top-level `service.type` is
  # silently ignored - the chart's values.schema.json accepts it and the
  # default (LoadBalancer) applies anyway. That mistake put this Service on a
  # MetalLB address already held by another ingress gateway, with conflicting
  # :80/:443. `helm template ... | grep 'type:'` is the check that catches it.
  spec:
    type: ClusterIP

ports:
  web:
    port: 8000
    hostPort: 80
    expose:
      default: true
    exposedPort: 80
  websecure:
    port: 8443
    hostPort: 443
    expose:
      default: true
    exposedPort: 443
    # TLS lives under .http.tls for an entrypoint, and defaults to enabled
    # here already - spelling it out only as a reminder of where it goes,
    # since `websecure.tls` looks right and is silently wrong. (The chart's
    # own values.schema.json rejects it, which is the only reason that
    # mistake is cheap.)
    http:
      tls:
        enabled: true

# The dashboard is not exposed. Reach it with a port-forward when needed:
#   microk8s kubectl port-forward -n traefik ds/traefik 9000:9000
#   open http://localhost:9000/dashboard/
ingressRoute:
  dashboard:
    enabled: false

# Watch Ingress resources in every namespace, and claim the ones with
# ingressClassName "traefik" plus those with no class set at all.
providers:
  kubernetesIngress:
    enabled: true
    allowEmptyServices: true
    publishedService:
      enabled: false
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: false

log:
  level: INFO

accessLog:
  # Off by default - access logs on a Pi's SD card are a lot of writes for
  # little value. Turn on while debugging routing.
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 192Mi

# Traefik must be able to bind :80/:443 on the host.
securityContext:
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE
  readOnlyRootFilesystem: true
