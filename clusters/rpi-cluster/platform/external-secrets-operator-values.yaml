# CRDs need no flag: installCRDs: true and every crds.create* are chart
# defaults. Three components, all trimmed for Pi hardware: the controller
# (does the syncing), the webhook (validates ExternalSecret/SecretStore
# objects on apply) and the cert-controller (generates the webhook's TLS
# certificate at runtime - which is why the chart ships the webhook Secret
# empty and no caBundle; both are filled in live, and ServerSideApply keeps
# ArgoCD from treating that as drift).
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

webhook:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi

certController:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi
