# Adopting the CNI that was installed by hand while bootstrapping the kubeadm
# cluster (see the separate kubeadm rebuild guide, step 7). These are the
# exact user-supplied values from that install - confirmed against the live
# release with `helm get values cilium -n kube-system` before writing this
# file. Do not add anything here without diffing it against the live release
# first (see the adoption runbook in docs/architecture.md); an unintended
# change to this file changes the cilium-config ConfigMap, which restarts
# every agent DaemonSet pod cluster-wide.
ipam:
  mode: kubernetes
kubeProxyReplacement: false

# LoadBalancer IPs are MetalLB's job, not Cilium's (see metallb.yaml). Cilium
# ships its own LB-IPAM and it is on by default; `none` makes it ignore
# LoadBalancer Services with no loadBalancerClass, so the two can never both
# claim or announce the same address. l2announcements is left at its chart
# default (off) for the same reason.
defaultLBServiceIPAM: none
