# Adopting the CNI that was installed by hand while bootstrapping the kubeadm
# cluster (see the separate kubeadm rebuild guide, step 7). These are the
# exact user-supplied values from that install - confirmed against the live
# release with `helm get values cilium -n kube-system` before writing this
# file. Do not add anything here without diffing it against the live release
# first (see the adoption runbook in docs/architecture.md); an unintended
# change to this file changes the cilium-config ConfigMap, which restarts
# every agent DaemonSet pod cluster-wide.
ipam:
  mode: kubernetes
kubeProxyReplacement: false

# Replaces MetalLB, whose L2 speaker had a confirmed bug: it correctly
# probed for the IP (duplicate-address detection) but never sent the actual
# ARP reply to the client - proven by packet capture, and isolated from
# Cilium/network issues by manually assigning the same IP to a node's eth0
# directly (worked instantly). Cilium's own LB-IPAM (enableLBIPAM, already
# the chart default) and L2 announcer replace MetalLB's IPAddressPool and
# L2Advertisement - see platform/cilium/ for the CiliumLoadBalancerIPPool and
# CiliumL2AnnouncementPolicy CRs.
l2announcements:
  enabled: true
