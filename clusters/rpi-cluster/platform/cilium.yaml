# Cilium CNI, adopting the release installed by hand during the kubeadm
# cluster bootstrap (see the kubeadm rebuild guide, step 7). Also now the
# LoadBalancer IP allocator (enableLBIPAM, chart default) and L2 announcer
# (l2announcements.enabled in cilium-values.yaml) for the cluster, replacing
# MetalLB - see platform/cilium/ for the CRs. MetalLB's L2 speaker had a
# confirmed bug (probed for the IP correctly, never sent the actual ARP
# reply - proven by packet capture and by isolating it from a real
# network/Cilium issue via a manual `ip addr add`), so this cluster moved
# the whole L2/IPAM job to Cilium's own datapath instead.
#
# syncPolicy is deliberately MANUAL, unlike every other Application here.
# The original reason was adoption-values-drift risk (matching an
# already-running release exactly, so a mismatch doesn't restart every
# agent unexpectedly). Any DELIBERATE change here - like enabling
# l2announcements - legitimately does restart every agent (a real config
# change, not drift), and should be synced by hand at a moment that's fine
# with a brief networking blip, same as the original adoption.
#
# Adoption runbook, in order:
#   1. helm get values cilium -n kube-system   (confirm cilium-values.yaml
#      matches exactly - it already does as of the values checked in here)
#   2. Let ArgoCD detect this Application, then `argocd app diff cilium`
#   3. Only once that diff is empty (or only adds ArgoCD's tracking label),
#      sync manually once
#   4. Then, and only then, add the standard
#      `syncPolicy.automated: {prune: true, selfHeal: true}` block used by
#      every other platform Application in this repo.
# See docs/architecture.md for the full runbook.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  sources:
    - repoURL: https://helm.cilium.io/
      chart: cilium
      targetRevision: 1.20.2
      helm:
        releaseName: cilium
        valueFiles:
          - $values/clusters/rpi-cluster/platform/cilium-values.yaml
    - repoURL: https://github.com/juan-gar/microk8s-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/juan-gar/microk8s-gitops.git
      targetRevision: main
      path: platform/cilium
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
