# Cilium CNI, adopting the release installed by hand during the kubeadm
# cluster bootstrap (see docs/kubeadm-install-guide.md, step 7). CNI only -
# LoadBalancer IPs and their ARP announcement belong to MetalLB
# (metallb.yaml); cilium-values.yaml switches Cilium's own LB-IPAM off so the
# two don't overlap.
#
# syncPolicy is deliberately MANUAL, unlike every other Application here.
# The original reason was adoption-values-drift risk (matching an
# already-running release exactly, so a mismatch doesn't restart every
# agent unexpectedly). Any DELIBERATE change here - like changing
# defaultLBServiceIPAM - legitimately does restart every agent (a real config
# change, not drift), and should be synced by hand at a moment that's fine
# with a brief networking blip, same as the original adoption.
#
# Adoption runbook, in order:
#   1. helm get values cilium -n kube-system   (confirm cilium-values.yaml
#      matches exactly - it already does as of the values checked in here)
#   2. Let ArgoCD detect this Application, then `argocd app diff cilium`
#   3. Only once that diff is empty (or only adds ArgoCD's tracking label),
#      sync manually once
#   4. Then, and only then, add the standard
#      `syncPolicy.automated: {prune: true, selfHeal: true}` block used by
#      every other platform Application in this repo.
# See docs/architecture.md for the full runbook.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  sources:
    - repoURL: https://helm.cilium.io/
      chart: cilium
      targetRevision: 1.20.2
      helm:
        releaseName: cilium
        valueFiles:
          - $values/clusters/rpi-cluster/platform/cilium-values.yaml
    - repoURL: https://github.com/juan-gar/pi-cluster-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  # The chart generates these two Secrets' certificates afresh on every render
  # (it labels them cilium.io/helm-template-non-idempotent), so they would
  # show OutOfSync forever. ignoreDifferences hides that diff;
  # RespectIgnoreDifferences stops a sync from overwriting the live certs with
  # a new random set, which would rotate Cilium's CA.
  ignoreDifferences:
    - kind: Secret
      name: cilium-ca
      namespace: kube-system
      jsonPointers:
        - /data
    - kind: Secret
      name: hubble-server-certs
      namespace: kube-system
      jsonPointers:
        - /data
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
