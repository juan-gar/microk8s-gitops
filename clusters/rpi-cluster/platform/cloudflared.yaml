# cloudflared: the connector for the Cloudflare Tunnel that serves
# juangar.com. It dials OUT to Cloudflare and keeps the connections open;
# Cloudflare sends visitors' requests down them. No router ports are opened
# and the home IP is never published. See docs/public-access-explained.md.
#
# Plain manifests, no chart - one Deployment doesn't warrant one. Where each
# request goes (juangar.com -> Envoy's Service) is NOT configured here: it's
# the tunnel's route in Cloudflare's dashboard (token-authenticated tunnels
# are remotely managed). docs/cloudflare-1password-setup.md, step 3.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudflared
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/juan-gar/pi-cluster-gitops.git
    targetRevision: main
    path: platform/cloudflared
  destination:
    server: https://kubernetes.default.svc
    namespace: cloudflared
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
