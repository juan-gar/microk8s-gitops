# Helm values for the argo/argo-cd chart, applied both at manual bootstrap
# time and afterwards by ArgoCD managing itself (see argocd.yaml). Keep the
# two in sync - the values used to bootstrap must match the values ArgoCD
# then adopts, or the first self-managed sync will fight the install.
#
# Trimmed down for a 3-node Raspberry Pi cluster: no HA components, modest
# resource requests, notifications/applicationset left on since they're cheap
# and useful, Dex left off since we don't need SSO for a homelab.

global:
  # argo-helm auto-detects arm64, but pin the tolerations/affinity story here
  # later if the Pis end up tainted/labelled for scheduling.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

redis-ha:
  enabled: false

redis:
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi

controller:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    # 512Mi was fine for the original argocd/traefik/prometheus/resume
    # footprint, but OOMKilled repeatedly (exit 137, CrashLoopBackOff) once
    # Cilium (~1850-line render), MetalLB and Envoy Gateway's CRD-heavy
    # charts were all added at once - the controller holds all of this in
    # memory to diff/apply. Bumped after confirming headroom on the Pis
    # (kubectl describe node: ~46% of limits committed on a 3.7Gi node).
    limits:
      memory: 1Gi

server:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
  # ClusterIP for now; expose via an Ingress/MetalLB LoadBalancer once
  # platform networking is scaffolded.
  service:
    type: ClusterIP

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      memory: 512Mi

applicationSet:
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

notifications:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

dex:
  enabled: false

configs:
  params:
    # Server-side diff: ask the API server what applying git's version would
    # produce, and compare THAT with live. The default (client-side) diff
    # compares raw git YAML, so every field the API server fills in with a
    # default shows up as drift - Gateway API objects are full of these
    # (parentRefs group/kind, listener defaults), which kept envoy-gateway
    # and prometheus permanently OutOfSync with nothing actually different.
    # Rolls the application controller automatically (checksum/cmd-params),
    # which the setting requires.
    controller.diff.server.side: "true"
