# External Secrets Operator (ESO): turns `ExternalSecret` objects in this
# repo ("I need item X, field Y from 1Password") into ordinary Kubernetes
# Secrets, and keeps them in sync. It reads 1Password through the Connect
# server (onepassword-connect.yaml), configured once cluster-wide by the
# ClusterSecretStore in platform/external-secrets/.
#
# Three sources, same convention as envoy-gateway.yaml. The third
# (path: platform/external-secrets) is the only reason the ClusterSecretStore
# is ever applied - root watches clusters/rpi-cluster, not platform/.
#
# ExternalSecrets do NOT live under platform/external-secrets/: each one sits
# with the component that consumes it (e.g. platform/cloudflared/), so the
# consumer's Application owns it and pruning ESO can't delete a Secret out
# from under a running workload.
#
# The token ESO uses to talk to Connect is a hand-made Secret
# (`onepassword-connect-token`, this namespace) - docs/cloudflare-1password-
# setup.md, step 7. Until it exists the ClusterSecretStore reports not Ready.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets-operator
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.11.0
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/clusters/rpi-cluster/platform/external-secrets-operator-values.yaml
    - repoURL: https://github.com/juan-gar/pi-cluster-gitops.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/juan-gar/pi-cluster-gitops.git
      targetRevision: main
      path: platform/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      # The ClusterSecretStore's CRD arrives in this same sync; without this
      # the dry run rejects the CR before its CRD exists.
      - SkipDryRunOnMissingResource=true
