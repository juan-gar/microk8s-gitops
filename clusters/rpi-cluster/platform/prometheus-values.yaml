# kube-prometheus-stack values, tuned for three Raspberry Pis.
#
# The full stack is designed for real clusters and will happily eat more RAM
# than a Pi has. Everything below is either "turn it off" or "make it smaller".

# --- Things microk8s does not expose -----------------------------------------
# These control-plane components run bound to 127.0.0.1 under microk8s, so
# their ServiceMonitors would scrape nothing and sit permanently red. Turning
# them off keeps the targets page honest.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

# --- Things we do not need ---------------------------------------------------
# No paging setup on a homelab; alertmanager is ~100Mi for nothing.
alertmanager:
  enabled: false

# Grafana is ON because this stack REPLACES the cluster's previous hand-rolled
# Grafana in the monitoring namespace. Turning it off here would mean losing
# dashboards entirely rather than swapping which Grafana serves them.
#
# The chart ships the standard Kubernetes dashboards (nodes, pods, workloads,
# and one per control-plane component) provisioned automatically, so the
# out-of-the-box view is decent. Any custom dashboards from the old install
# are NOT carried over - they were never in git. Add them under
# `dashboardsConfigMaps` or `dashboards` here so they are from now on.
grafana:
  enabled: true

  # Default login is admin / prom-operator. Change it: set a password here and
  # move it into a Secret once secrets management is scaffolded.
  adminPassword: prom-operator

  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      # Grafana is a Go binary plus a JS frontend; 256Mi is comfortable for a
      # handful of dashboards on a Pi.
      memory: 256Mi

  # Reachable at grafana.lan once Traefik is the only ingress controller.
  # Same className the resume site uses - see apps/resume/values.yaml.
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - grafana.lan
    path: /
    pathType: Prefix

  # Persist dashboards/users across restarts. Without this, anything created
  # through the UI is lost on every pod restart - which, on a cluster whose
  # nodes have been flapping, is often.
  persistence:
    enabled: true
    type: sts
    storageClassName: microk8s-hostpath
    accessModes:
      - ReadWriteOnce
    size: 2Gi

# --- The actual scrapers the resume site depends on ---------------------------
# node-exporter -> node_cpu_seconds_total, node_memory_* (the CPU/memory bars)
nodeExporter:
  enabled: true
prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 48Mi
  prometheus:
    monitor:
      # Without this, `instance` is the exporter pod's IP:port, so the resume
      # site's node panel reads "10.1.45.3" instead of "pi-01". Rewriting it to
      # the node name is what makes the page show real hostnames.
      #
      # The site splits `instance` on ":" and takes the first field, so this
      # stays compatible either way - it just becomes a no-op split.
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: instance
          action: replace

# kube-state-metrics -> kube_pod_info (the pod count) and the deployment
# series, if you later make that table live.
kubeStateMetrics:
  enabled: true
kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi
    limits:
      memory: 128Mi

prometheusOperator:
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 192Mi

prometheus:
  prometheusSpec:
    # 7 days at 30s is plenty for a status panel and keeps the volume small.
    retention: 7d
    retentionSize: 6GB
    scrapeInterval: 30s
    evaluationInterval: 30s

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        # Prometheus is memory-hungry and NOT graceful when it hits a limit -
        # it gets OOM-killed mid-compaction. If it restarts under load, raise
        # this before lowering retention.
        memory: 1Gi

    # Watch every namespace, not just the ones with the release's own labels.
    # Without these, ServiceMonitors you add elsewhere are silently ignored -
    # a very common "why is my target missing" cause.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    # Persist across restarts using the microk8s hostpath provisioner
    # (`microk8s enable hostpath-storage`). Note hostpath pins the pod to
    # whichever node the volume landed on - acceptable for a single
    # Prometheus, not something to copy for a workload you want rescheduled.
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: microk8s-hostpath
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 8Gi
