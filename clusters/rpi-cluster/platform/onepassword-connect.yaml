# 1Password Connect: a small self-hosted server that is allowed to read the
# 1Password vault `K8S` and hands items out over HTTP inside the cluster.
# External Secrets Operator (external-secrets-operator.yaml) is its only
# client. Two containers: connect-api (answers requests) and connect-sync
# (keeps a local encrypted copy of the vault in sync with 1Password).
#
# Its own credential - 1password-credentials.json - can't come from
# 1Password (it's what unlocks 1Password), so it's a hand-made Secret,
# `op-credentials`, created once per cluster build and never in git. See
# docs/cloudflare-1password-setup.md, step 7. Until it exists, both
# containers crash-loop; that's expected on a fresh cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onepassword-connect
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://1password.github.io/connect-helm-charts/
      chart: connect
      targetRevision: 2.4.1
      helm:
        releaseName: connect
        valueFiles:
          - $values/clusters/rpi-cluster/platform/onepassword-connect-values.yaml
    - repoURL: https://github.com/juan-gar/pi-cluster-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: onepassword-connect
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
