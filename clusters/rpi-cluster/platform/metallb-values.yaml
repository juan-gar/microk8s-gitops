# MetalLB values for a 3-node bare-metal Raspberry Pi cluster. Chart defaults
# are sane for a simple L2 setup (no BGP/FRR needed on a single flat LAN), so
# beyond trimming resources for Pi hardware there is one setting that matters.
speaker:
  # REQUIRED on this cluster. kubeadm labels every control-plane node
  # node.kubernetes.io/exclude-from-external-load-balancers, and the speaker
  # refuses to announce from labelled nodes. All three nodes here are
  # control-plane, so without this no node ever answers ARP for a pool IP -
  # the Service gets its EXTERNAL-IP and nothing on the LAN can reach it. In
  # L2 mode that skip is only logged at debug level, so it looks like a
  # silent speaker bug (it cost a detour to Cilium's L2 announcer once; see
  # docs/architecture.md). MetalLB troubleshooting docs: "MetalLB is not
  # advertising my service from my control-plane nodes".
  ignoreExcludeLB: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi

controller:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi
