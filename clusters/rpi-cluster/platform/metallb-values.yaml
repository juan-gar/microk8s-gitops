# MetalLB values for a 3-node bare-metal Raspberry Pi cluster. Chart defaults
# are sane for a simple L2 setup (no BGP/FRR needed on a single flat LAN), so
# this only trims resource requests for Pi hardware.
speaker:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi

controller:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 96Mi
