connect:
  # credentials / credentials_base64 deliberately unset: with them empty the
  # chart creates no Secret and just mounts the pre-existing one named by
  # credentialsName/credentialsKey (these are the chart defaults, pinned here
  # because the hand-made Secret has to match them exactly).
  credentialsName: op-credentials
  credentialsKey: 1password-credentials.json

  api:
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        memory: 128Mi
  sync:
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        memory: 128Mi

# The chart can also install 1Password's own Kubernetes operator; off,
# because External Secrets Operator does that job here.
operator:
  create: false
