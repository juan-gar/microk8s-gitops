# kube-prometheus-stack: Prometheus + node-exporter + kube-state-metrics.
#
# The resume site queries this through a same-origin nginx proxy (see
# apps/resume). node-exporter supplies the CPU/memory series, and
# kube-state-metrics supplies kube_pod_info for the pod count - the site needs
# BOTH, which is the main reason for using this bundle rather than the bare
# prometheus chart.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 88.6.3
      helm:
        # The release name determines the Service DNS name that apps/resume
        # proxies to. Keeping it "prometheus" yields:
        #   prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local
        # Change this and you MUST update prometheus.proxy.url in
        # apps/resume/values.yaml to match.
        releaseName: prometheus
        valueFiles:
          - $values/clusters/rpi-cluster/platform/prometheus-values.yaml
    - repoURL: https://github.com/juan-gar/microk8s-gitops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # REQUIRED for this chart. The Prometheus Operator CRDs are far larger
      # than the 262kB limit on the kubectl.kubernetes.io/last-applied-
      # configuration annotation that client-side apply writes. Without
      # ServerSideApply the sync fails with "metadata.annotations: Too long".
      - ServerSideApply=true
      # The CRDs are installed by the chart itself; skip ArgoCD's own
      # dry-run validation of resources whose CRD may not exist yet on a
      # first sync.
      - SkipDryRunOnMissingResource=true
  # CRDs plus the operator plus the Prometheus StatefulSet take a while to
  # settle on Raspberry Pi hardware. Give retries room before ArgoCD gives up.
  ignoreDifferences:
    # The operator mutates its own CRD caBundle; ArgoCD would flap on it.
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/conversion/webhook/clientConfig/caBundle
