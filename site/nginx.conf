# Local-development config, baked into the image.
#
# IN THE CLUSTER THIS FILE IS NOT USED. The Helm chart mounts a ConfigMap over
# /etc/nginx/conf.d, replacing it - see apps/resume/templates/configmap.yaml,
# which is the real source of truth and is templated from values.yaml. This
# copy exists so `docker run` gives you something representative.

limit_req_zone $binary_remote_addr zone=promq:1m rate=10r/s;

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|woff2?)$ {
    expires 3600s;
    add_header Cache-Control "public, max-age=3600";
  }

  # Same-origin Prometheus proxy: the browser calls /api/v1/query, nginx
  # forwards to Prometheus inside the cluster. No CORS, no exposed Prometheus.
  #
  # Exact-match, not `location /api/`: a prefix match would also expose
  # /api/v1/query_range, /api/v1/series, /federate and the admin endpoints.
  #
  # The upstream goes through a variable so nginx resolves it per-request
  # rather than at startup - with a literal name here, nginx refuses to start
  # at all when Prometheus is absent, which on a laptop means the container
  # just dies. Requires an explicit resolver, and means the query string has
  # to be appended by hand ($is_args$args).
  #
  # 127.0.0.11 is Docker's embedded DNS. In the cluster the chart substitutes
  # CoreDNS instead.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $prom http://prometheus-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090;

  location = /api/v1/query {
    limit_except GET { deny all; }
    limit_req zone=promq burst=20 nodelay;

    proxy_pass $prom/api/v1/query$is_args$args;
    proxy_set_header Host $host;
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    add_header Cache-Control "no-store" always;
  }

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
  }
}
