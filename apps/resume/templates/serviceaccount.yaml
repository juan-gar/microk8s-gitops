{{- /*
Whole-file conditional. When serviceAccount.create is false this file renders
to nothing at all - Helm discards output that contains only whitespace, so no
empty document reaches the cluster.

Note the {{- if ... }} wraps the entire file including the apiVersion line.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "resume.serviceAccountName" . }}
  labels:
    {{- include "resume.componentLabels" (dict "ctx" . "component" "web") | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
