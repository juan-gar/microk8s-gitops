# This Gateway's auto-created Service is type: LoadBalancer and draws an IP
# from the MetalLB pool (192.168.0.210-192.168.0.230, see platform/metallb/).
# Unlike Traefik's
# per-node hostPort model, every hostname now resolves to this ONE shared IP
# - check `kubectl get svc -n envoy-gateway-system` for the actual address,
# nothing pins it to a specific one.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: envoy-gateway-system
spec:
  gatewayClassName: eg
  # Replica count, spreading and PDB for this Gateway's Envoy pods - see
  # envoyproxy.yaml.
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    # HTTPS, one listener PER HOSTNAME. Gateway API only guarantees a single
    # certificateRefs entry per listener (more is implementation-specific), so
    # don't "simplify" these into one listener with two certificates. Each
    # Secret is written by a cert-manager Certificate in this namespace
    # (platform/cert-manager/) - it must be here, next to the Gateway, or the
    # listener goes ResolvedRefs=False with RefNotPermitted.
    - name: https-resume
      protocol: HTTPS
      port: 443
      hostname: resume.home.juangar.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: resume-home-tls
      allowedRoutes:
        namespaces:
          from: All
    - name: https-grafana
      protocol: HTTPS
      port: 443
      hostname: grafana.home.juangar.com
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: grafana-home-tls
      allowedRoutes:
        namespaces:
          from: All
