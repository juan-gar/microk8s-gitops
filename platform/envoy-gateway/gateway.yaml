# This Gateway's auto-created Service is type: LoadBalancer and draws an IP
# from the MetalLB pool (192.168.0.210-192.168.0.230, see platform/metallb/).
# Unlike Traefik's
# per-node hostPort model, every hostname now resolves to this ONE shared IP
# - check `kubectl get svc -n envoy-gateway-system` for the actual address,
# nothing pins it to a specific one.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: envoy-gateway-system
spec:
  gatewayClassName: eg
  # Replica count, spreading and PDB for this Gateway's Envoy pods - see
  # envoyproxy.yaml.
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
