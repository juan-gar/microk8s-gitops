# Grafana's admin login, from 1Password (vault K8S, item grafana-admin,
# password in the field labelled `token`). Replaces the chart default
# admin / prom-operator, which was written in this public repo.
#
# The username isn't secret, so it's a literal in the template rather than a
# 1Password field; it stays `admin`, the account Grafana's database already
# has. Referenced by grafana.admin.existingSecret in prometheus-values.yaml.
#
# CHANGING THE PASSWORD in 1Password does NOT change Grafana's: Grafana only
# applies its admin password when it first creates its database, and this
# one persists on a volume. After ESO refreshes the Secret (up to 1h, or
# annotate the ExternalSecret with force-sync=$(date +%s)) and the pod has
# restarted, reset it from the pod's own environment so the value never
# leaves the cluster:
#   kubectl exec -n monitoring prometheus-grafana-0 -c grafana -- \
#     sh -c 'grafana cli admin reset-admin-password "$GF_SECURITY_ADMIN_PASSWORD"'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: grafana-admin
        property: token
