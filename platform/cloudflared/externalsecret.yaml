# The tunnel token, from 1Password (vault K8S, item cloudflare-tunnel-token,
# field token). Anyone holding it can connect AS this tunnel.
#
# It's the long eyJ... string from the tunnel's install command - NOT the
# 36-character tunnel ID shown on the tunnel page; cloudflared can't connect
# with the ID. Filed here, not under platform/external-secrets/, so the
# cloudflared Application owns the Secret its pods depend on.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-tunnel-token
  namespace: cloudflared
  annotations:
    # Before the workload that mounts the Secret this creates. Without it,
    # ArgoCD can apply the workload first and wait for it to become healthy,
    # which it can't without the Secret - a deadlock that took Grafana down
    # for ~6 minutes when this pattern was first added.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cloudflare-tunnel-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: cloudflare-tunnel-token
        property: token
