# Let's Encrypt PRODUCTION: browser-trusted certificates, strict rate limits.
# Prove changes against letsencrypt-staging first.
#
# No email: it's optional for ACME, and this repo is public.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # cert-manager creates this Secret (the ACME account key) on first use.
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - selector:
          dnsZones:
            - juangar.com
        dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token
