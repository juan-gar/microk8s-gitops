# The Cloudflare API token cert-manager uses for DNS-01, pulled from
# 1Password (vault K8S). Lives in the cert-manager namespace because a
# ClusterIssuer looks up referenced Secrets in cert-manager's "cluster
# resource namespace", which is the namespace it runs in.
#
# Scoped in Cloudflare to Zone:DNS:Edit + Zone:Zone:Read on juangar.com only
# (docs/cloudflare-1password-setup.md, step 4).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
  data:
    # secretKey (the Kubernetes Secret's key) is what the ClusterIssuers
    # reference; remoteRef is the 1Password item title and field label.
    - secretKey: api-token
      remoteRef:
        key: cloudflare-api-token
        property: token
