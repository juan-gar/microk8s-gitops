# Replaces MetalLB's L2Advertisement. Restricted to eth0 explicitly (a
# regex, per the field's spec) rather than leaving interfaces nil (= all
# interfaces) - MetalLB's speaker log showed it creating ARP responders on
# both eth0 and cilium_vxlan, which was one candidate explanation for its
# ARP replies never reaching the physical LAN. Being explicit here avoids
# the same ambiguity, even though it's Cilium's own (different) L2 announcer.
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: lan-pool
spec:
  loadBalancerIPs: true
  interfaces:
    - ^eth0$
