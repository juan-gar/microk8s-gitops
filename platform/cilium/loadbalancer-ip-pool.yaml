# Replaces MetalLB's IPAddressPool. Same range reserved by the kubeadm
# rebuild guide, outside both the router's DHCP pool (192.168.0.33-.199)
# and the API server's kube-vip VIP (192.168.0.200).
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan-pool
spec:
  blocks:
    - start: 192.168.0.210
      stop: 192.168.0.230
