# How ESO reaches 1Password, cluster-wide: through the Connect server's
# in-cluster Service, authenticating with the hand-made token Secret.
# `vaults` is a priority list (lower number is searched first); K8S is the
# only vault the Connect server was granted.
#
# Items fetched through this store must be 1Password "Password" or
# "Document" items - the only two types this provider supports. An
# ExternalSecret's remoteRef.key is the item's title and remoteRef.property
# the field's label.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.onepassword-connect.svc.cluster.local:8080
      vaults:
        K8S: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-connect-token
            namespace: external-secrets
            key: token
