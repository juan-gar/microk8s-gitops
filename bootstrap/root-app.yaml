---
# One-time, manually-applied bootstrap. This is the only Application in this
# repo that is NOT applied by ArgoCD itself - everything else flows from it.
#
# `directory.recurse: true` means ArgoCD watches clusters/rpi-cluster for any
# YAML files defining Application resources and keeps them in sync. Add a new
# platform component or app by dropping an Application manifest under
# clusters/rpi-cluster/{platform,apps}/ - no need to touch this file again.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/juan-gar/microk8s-gitops.git
    targetRevision: main
    path: clusters/rpi-cluster
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
